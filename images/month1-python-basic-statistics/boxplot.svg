<svg xmlns="http://www.w3.org/2000/svg" width="800" height="245" viewBox="0 0 800 245" role="img" aria-labelledby="title desc">
  <title id="title">상자그림의 다섯 가지 요약수치</title><desc id="desc">최솟값, 제1사분위수, 중앙값, 제3사분위수, 최댓값을 나타낸 상자그림이다.</desc>
  <style>text{font-family:Arial,'Malgun Gothic',sans-serif;fill:#1f2937}.h{font-size:18px;font-weight:700}.t{font-size:15px}.line{stroke:#334155;stroke-width:3}.box{fill:#bfdbfe;stroke:#2563eb;stroke-width:3}.median{stroke:#dc2626;stroke-width:4}</style><rect width="800" height="245" fill="#f8fafc"/><text x="42" y="36" class="h">상자그림: 다섯 가지 요약수치와 가운데 50%</text><line x1="100" y1="135" x2="700" y2="135" class="line"/><line x1="100" y1="105" x2="100" y2="165" class="line"/><line x1="700" y1="105" x2="700" y2="165" class="line"/><rect x="250" y="85" width="300" height="100" class="box"/><line x1="400" y1="85" x2="400" y2="185" class="median"/><g class="t" text-anchor="middle"><text x="100" y="198">최솟값</text><text x="250" y="218">Q1 · 25%</text><text x="400" y="70" fill="#dc2626">Q2 · 중앙값</text><text x="550" y="218">Q3 · 75%</text><text x="700" y="198">최댓값</text><text x="400" y="150">IQR: 가운데 50%의 범위</text></g>
</svg>
