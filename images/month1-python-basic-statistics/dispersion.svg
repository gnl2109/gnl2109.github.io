<svg xmlns="http://www.w3.org/2000/svg" width="800" height="280" viewBox="0 0 800 280" role="img" aria-labelledby="title desc">
  <title id="title">퍼진 정도 비교</title><desc id="desc">평균은 같지만 표준편차와 범위가 다른 두 자료의 분포를 비교한다.</desc>
  <style>text{font-family:Arial,'Malgun Gothic',sans-serif;fill:#1f2937}.h{font-size:18px;font-weight:700}.t{font-size:15px}.axis{stroke:#64748b;stroke-width:2}.mean{stroke:#dc2626;stroke-width:2;stroke-dasharray:5 4}.a{fill:#2563eb}.b{fill:#f59e0b}.range{stroke:#7c3aed;stroke-width:3}</style><rect width="800" height="280" fill="#f8fafc"/><text x="42" y="34" class="h">평균이 같아도 자료의 퍼짐은 다를 수 있다</text>
  <text x="42" y="72" class="t">작게 퍼짐 · 표준편차 작음</text><line x1="80" y1="130" x2="720" y2="130" class="axis"/><line x1="400" y1="80" x2="400" y2="150" class="mean"/><text x="405" y="94" class="t">평균</text><g class="a"><circle cx="360" cy="115" r="8"/><circle cx="380" cy="115" r="8"/><circle cx="400" cy="115" r="8"/><circle cx="420" cy="115" r="8"/><circle cx="440" cy="115" r="8"/></g><line x1="360" y1="152" x2="440" y2="152" class="range"/><text x="400" y="174" text-anchor="middle" class="t">범위가 좁음</text>
  <text x="42" y="212" class="t">크게 퍼짐 · 표준편차 큼</text><line x1="80" y1="250" x2="720" y2="250" class="axis"/><line x1="400" y1="200" x2="400" y2="270" class="mean"/><g class="b"><circle cx="200" cy="235" r="8"/><circle cx="300" cy="235" r="8"/><circle cx="400" cy="235" r="8"/><circle cx="500" cy="235" r="8"/><circle cx="600" cy="235" r="8"/></g><line x1="200" y1="272" x2="600" y2="272" class="range"/><text x="635" y="270" class="t">범위가 넓음</text>
</svg>
