<svg xmlns="http://www.w3.org/2000/svg" width="800" height="300" viewBox="0 0 800 300" role="img" aria-labelledby="title desc">
  <title id="title">도수분포표</title><desc id="desc">키 자료를 계급별 인원수로 묶은 막대그래프와 계급중앙값을 보여준다.</desc>
  <style>text{font-family:Arial,'Malgun Gothic',sans-serif;fill:#1f2937}.h{font-size:18px;font-weight:700}.t{font-size:14px}.axis{stroke:#475569;stroke-width:2}.bar{fill:#2563eb}.mid{fill:#dc2626;font-weight:700}</style><rect width="800" height="300" fill="#f8fafc"/><text x="42" y="34" class="h">도수분포표: 개별 자료를 구간별 빈도로 요약</text><line x1="100" y1="245" x2="735" y2="245" class="axis"/><line x1="100" y1="55" x2="100" y2="245" class="axis"/>
  <g class="bar"><rect x="145" y="185" width="95" height="60"/><rect x="285" y="95" width="95" height="150"/><rect x="425" y="65" width="95" height="180"/><rect x="565" y="185" width="95" height="60"/></g>
  <g class="t" text-anchor="middle"><text x="192" y="270">160–164</text><text x="332" y="270">165–169</text><text x="472" y="270">170–174</text><text x="612" y="270">175–179</text><text x="82" y="70">12명</text><text x="84" y="130">8명</text><text x="84" y="190">4명</text></g><g class="t" text-anchor="middle"><text x="192" y="178">4명</text><text x="332" y="88">10명</text><text x="472" y="58">12명</text><text x="612" y="178">4명</text></g><text x="400" y="294" text-anchor="middle" class="mid">각 구간은 계급중앙값(162, 167, 172, 177)으로 근사 계산</text>
</svg>
