<svg xmlns="http://www.w3.org/2000/svg" width="800" height="315" viewBox="0 0 800 315" role="img" aria-labelledby="title desc">
  <title id="title">두 변수 자료 요약</title><desc id="desc">범주형 변수는 분할표로, 수치형 변수는 산점도와 상관계수로 관계를 살핀다.</desc>
  <style>text{font-family:Arial,'Malgun Gothic',sans-serif;fill:#1f2937}.h{font-size:18px;font-weight:700}.t{font-size:14px}.grid{stroke:#94a3b8;stroke-width:1}.axis{stroke:#475569;stroke-width:2}.pt{fill:#2563eb}.trend{stroke:#dc2626;stroke-width:2}</style><rect width="800" height="315" fill="#f8fafc"/><text x="42" y="34" class="h">두 변수의 관계: 범주형은 분할표, 수치형은 산점도</text><text x="85" y="72" class="t">범주형 자료 · 분할표</text><g class="grid" fill="none"><rect x="80" y="88" width="260" height="126"/><line x1="80" y1="130" x2="340" y2="130"/><line x1="80" y1="172" x2="340" y2="172"/><line x1="145" y1="88" x2="145" y2="214"/><line x1="210" y1="88" x2="210" y2="214"/><line x1="275" y1="88" x2="275" y2="214"/></g><g class="t" text-anchor="middle"><text x="112" y="114">성별</text><text x="177" y="114">A</text><text x="242" y="114">B</text><text x="307" y="114">O</text><text x="112" y="156">남</text><text x="177" y="156">20</text><text x="242" y="156">15</text><text x="307" y="156">25</text><text x="112" y="198">여</text><text x="177" y="198">18</text><text x="242" y="198">8</text><text x="307" y="198">14</text></g><text x="440" y="72" class="t">수치형 자료 · 산점도와 상관</text><line x1="430" y1="225" x2="735" y2="225" class="axis"/><line x1="430" y1="225" x2="430" y2="85" class="axis"/><line x1="455" y1="205" x2="710" y2="105" class="trend"/><g class="pt"><circle cx="465" cy="202" r="5"/><circle cx="495" cy="185" r="5"/><circle cx="530" cy="175" r="5"/><circle cx="560" cy="157" r="5"/><circle cx="600" cy="150" r="5"/><circle cx="635" cy="130" r="5"/><circle cx="670" cy="120" r="5"/><circle cx="700" cy="105" r="5"/></g><text x="580" y="260" text-anchor="middle" class="t">점들이 직선에 가까울수록 |상관계수|가 큼</text><text x="580" y="286" text-anchor="middle" class="t">상관관계 ≠ 인과관계</text>
</svg>
